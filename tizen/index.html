<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>Plebflix TV</title>
  <link rel="stylesheet" href="tv.css">
  <script src="diagnostics.js"></script>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body data-language="international">
  <video id="video" playsinline></video>
  <div id="youtube"></div>
  <div id="signal" class="tuning" aria-live="polite">
    <div class="snow"></div><div class="colour-bars"></div>
    <div class="station-ident"><img id="ident" src="brand/ident-intl.svg" alt="Plebflix International"><div id="signal-label">TUNING IN</div></div>
  </div>
  <div id="boot"><img src="brand/wordmark-tagline-intl.svg" alt="Plebflix"><p>YOUR BROADCAST IS STARTING</p></div>
  <div id="banner" hidden></div>
  <main id="panel" hidden></main>
  <script src="snapshot.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
