name: Validate channels

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types --include-runtime false --check
      - run: npm test
      - run: npm run validate
      - run: npm run resources -- --check
      - run: npm run typecheck
      - run: npm run build
