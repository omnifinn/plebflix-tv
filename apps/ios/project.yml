name: PlebflixStandalone
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  PlebflixStandalone:
    type: application
    platform: iOS
    sources: [Plebflix]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plebflix.standalone
        PRODUCT_NAME: Plebflix
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '5.0'
